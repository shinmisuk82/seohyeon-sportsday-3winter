function relayRanks(){let finalists=relayFinalists();if(finalists.length!==4)return {};let finals=relayGroup('F').filter(x=>finalists.includes(x.class_no));if(finals.some(x=>!x.rank)||new Set(finals.map(x=>x.rank)).size!==4||finals.some(x=>x.rank<1||x.rank>4))return {};let result={};finals.forEach(x=>result[x.class_no]=x.rank);for(let n=1;n<=8;n++)if(!result[n])result[n]=5;return result}
function relayView(){let finalists=relayFinalists();return `<div class="two">${['A','B'].map((g,i)=>`<div class="group"><h3>예선 ${i+1}조 · 4개 반 동시 경기</h3><p>${D.league['이어달리기'][i].split('').map(x=>x+'반').join(' · ')}</p>${relayGroup(g).map(r=>`<div class="match"><b>${r.class_no}반</b><span>${r.rank?r.rank+'위':'순위 미입력'}</span><span>${r.rank&&r.rank<=2?'결승 진출권':''}</span></div>`).join('')}</div>`).join('')}</div><h3>🏆 최종 결승 · 4개 반 동시 경기</h3>${finalists.length===4?finalists.map(n=>{let r=relayGroup('F').find(x=>x.class_no===n);return `<div class="match"><b>${n}반</b><span>${r?.rank?r.rank+'위':'미입력'}</span><span>결승</span></div>`}).join(''):'<div class="notice">각 예선 조의 1·2위가 모두 확정되면 결승 진출 4개 반이 자동 표시돼.</div>'}<p class="muted small">준결승 없음 · 예선 조별 1~4위 입력 → 각 조 상위 2개 반 결승 → 결승 1~4위 확정</p>`}
function adminRelay(){let finalists=relayFinalists();return `<h3>🏃 이어달리기 예선 순위 입력</h3>${['A','B'].map((g,i)=>`<div class="group"><h3>${i+1}조</h3>${relayGroup(g).map(r=>`<div class="row" style="margin:8px 0"><b>${r.class_no}반</b><select id="relay-${g}-${r.class_no}"><option value="">미입력</option>${[1,2,3,4].map(n=>`<option value="${n}" ${r.rank===n?'selected':''}>${n}위</option>`).join('')}</select><button class="primary" onclick="saveRelay('${g}',${r.class_no})">저장</button></div>`).join('')}</div>`).join('')}<h3>최종 결승 (4개 반)</h3>${finalists.length===4?finalists.map(n=>{let r=relayGroup('F').find(x=>x.class_no===n);return `<div class="row" style="margin:8px 0"><b>${n}반</b><select id="relay-F-${n}"><option value="">미입력</option>${[1,2,3,4].map(k=>`<option value="${k}" ${r?.rank===k?'selected':''}>${k}위</option>`).join('')}</select><button class="primary" onclick="saveRelay('F',${n})">저장</button></div>`}).join(''):'<div class="notice">예선 2개 조의 순위를 확정하면 결승 입력이 활성화돼.</div>'}<p class="muted small">동일 순위 중복 입력은 저장할 수 없어. 결승 진출자가 변경되면 이전 결승 순위는 무효 처리돼.</p>`}
function saveRelay(g,n){let r=state.relay_results.find(x=>x.group_name===g&&x.class_no===n),v=+$('relay-'+g+'-'+n).value||null;if(v&&state.relay_results.some(x=>x.group_name===g&&x.class_no!==n&&x.rank===v&&(g!=='F'||relayFinalists().includes(x.class_no))))return alert('같은 조에 동일한 순위가 있어.');if(g==='F'&&!relayFinalists().includes(n))return alert('결승 진출팀이 아니야.');save('save_relay',{p_group:g,p_class:n,p_version:r.version,p_rank:v},()=>{r.rank=v;r.version++;if(g!=='F'){state.relay_results.filter(x=>x.group_name==='F').forEach(x=>{x.rank=null;x.version++})}})}
function ranks(){let out=Object.fromEntries(Array.from({length:8},(_,i)=>[i+1,{n:i+1,total:0,detail:{},penalty:0}]));for(const s of SPORTS){let ms=rows(s),ranks={};if(s==='이어달리기'){ranks=relayRanks()}else if(D.records.includes(s)){let rr=state.records.filter(r=>r.sport===s);if(rr.every(r=>r.result!==null)){const sorted=[...rr].sort((a,b)=>s==='체인지 걷기'?b.result-a.result:s==='단체줄넘기'||s==='농구자유투'?b.result-a.result:a.result-b.result);if(sorted.every((x,i)=>i===0||x.result!==sorted[i-1].result))sorted.forEach((x,i)=>ranks[x.class_no]=i+1);}}else{const final=resolved(ms.find(m=>m.stage==='final'));if(final?.winner){ranks[final.winner]=1;ranks[final.home===final.winner?final.away:final.home]=2;let semis=ms.filter(m=>m.stage==='semi').map(resolved);if(semis.every(x=>x.winner)){for(const x of semis)ranks[x.home===x.winner?x.away:x.home]=3;let others=Array.from({length:8},(_,i)=>i+1).filter(n=>!ranks[n]);others.forEach(n=>ranks[n]=5);}}}
for(let n=1;n<=8;n++){let r=ranks[n];if(r){const p=D.points[s][r===1?0:r===2?1:r<=4?2:3];out[n].total+=p;out[n].detail[s]=p;}}}
for(const p of state.penalties.filter(p=>!p.voided_at)){let pts=p.kind==='sportsmanship_positive'?10:-10;out[p.class_no].total+=pts;out[p.class_no].penalty+=p.kind==='sportsmanship_positive'?0:1;}return Object.values(out).sort((a,b)=>b.total-a.total||a.n-b.n)}
function penalties(){let active=state.penalties.filter(p=>!p.voided_at);return {active,total:active.filter(p=>p.kind!=='sportsmanship_positive').length,per:Array.from({length:8},(_,i)=>active.filter(p=>p.class_no===i+1&&p.kind!=='sportsmanship_positive').length)};}
const PERIODS=[['1교시','09:00'],['2교시','10:00'],['3교시','11:00'],['점심시간','12:00'],['4교시','13:00'],['5교시','14:00'],['6교시','15:00'],['7교시','16:00']];
function periodOf(iso){if(!iso)return '';const d=new Date(iso),h=d.getHours(),m=d.getMinutes(),v=h*60+m;return PERIODS.reduce((best,p)=>Math.abs(Number(p[1].slice(0,2))*60+Number(p[1].slice(3))-v)<Math.abs(Number(best[1].slice(0,2))*60+Number(best[1].slice(3))-v)?p:best,PERIODS[0])[0];}
function dayOf(iso){if(!iso)return '';const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function periodDate(iso){if(!iso)return '미정';return new Date(iso).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'})+' '+periodOf(iso);}
function home(){
  const ranking=card('🏆 실시간 종합점수',`<div class="scroll"><table><tr><th>순위(임시)</th><th>학급</th><th>누적 점수</th></tr>${ranks().map((r,i)=>`<tr><td>${i+1}</td><td>3-${r.n}반</td><td><b>${r.total}</b>점</td></tr>`).join('')}</table></div><p class="muted small">완료된 종목의 점수만 반영하며, 동점 시 순위는 임시 표시야.</p>`);
  const today=new Date(),days=[],cursor=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  while(days.length<3){if(cursor.getDay()!==0&&cursor.getDay()!==6)days.push(new Date(cursor));cursor.setDate(cursor.getDate()+1)}
  const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const games=state.schedule.filter(x=>x.starts_at&&days.some(d=>dateKey(d)===dateKey(new Date(x.starts_at)))).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  const scheduleCard=card('📅 앞으로 평일 3일간 경기일정',`<p class="muted small">${days.map(d=>d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'})).join(' · ')}</p>${games.length?`<div class="scroll"><table><tr><th>일시</th><th>종목</th><th>대진</th><th>장소</th></tr>${games.map(g=>{const m=match(g.match_id);if(!m)return '';const x=resolved(m),dt=new Date(g.starts_at);return `<tr><td>${periodDate(g.starts_at)}</td><td>${esc(m.sport)}</td><td>${label(x.home)} VS ${label(x.away)}</td><td>${esc(g.venue||'미정')}</td></tr>`}).join('')}</table></div>`:'<p class="muted">해당 기간에 등록된 경기일정이 없어.</p>'}`);
  const p=penalties(),t=p.total;
  const penaltyCard=card('🚨 실시간 누적 지적 현황',`<div class="grid"><div class="tile ${t>=18?'red':t>=15?'amber':''}">전체 지적 횟수<strong>${t} / 20회</strong>${t>=20?'리그 전면 취소 기준 도달':`종료 기준까지 ${20-t}회`}</div><div class="tile">스포츠맨십 감점<strong>${p.active.filter(x=>x.kind==='sportsmanship_negative').length}회</strong></div><div class="tile">마일리지·질서 감점<strong>${p.active.filter(x=>x.kind==='mileage').length}회</strong></div></div><h3>학급별 감점 횟수</h3><div class="grid">${p.per.map((v,i)=>`<div class="tile ${v>=10?'red':''}">3-${i+1}반<strong>${v}회</strong>${v>=10?'출전 정지 기준 도달':''}</div>`).join('')}</div><p class="muted small">※ 계획서의 ‘쓰레기 및 질서 관련 지적’ 10회/20회 기준과 스포츠맨십 감점을 함께 집계할지는 운영자 최종 확인이 필요해. 현재 시제품은 두 감점 항목을 합산해 표시해.</p>`);
  return ranking+scheduleCard+penaltyCard;
}
function rules(){return card('📋 경기규정',`<p>학급 대항 · 리그 및 토너먼트 혼합 · 선수교체 규정 및 질서 준수</p><div class="notice">학급별 지적 10회 이상: 몰수패 및 잔여 종목 출전 불허<br>전체 지적 20회 이상: 리그전 전면 취소</div><p>조별리그(축구·피구·얼티미트·농구): 각 조 1·2위 준결승 진출</p><p>이어달리기: 4개 반씩 예선 2경기, 각 조 1·2위가 4개 반 최종 결승 (준결승 없음)</p><p>토너먼트: 8강 → 준결승 → 결승</p><p>기록경기: 종목별 기록으로 등위 산정</p><p class="muted">동률 처리 및 종목별 세부 규칙은 계획서와 심판진의 결정에 따라 운영해야 해.</p>`)}
function points(){return card('🏅 종목별 배점표',`<div class="scroll"><table><tr><th>종목</th><th>1위</th><th>2위</th><th>3~4위</th><th>5~8위</th></tr>${SPORTS.map(s=>`<tr><td>${s}</td>${D.points[s].map(n=>`<td>${n}</td>`).join('')}</tr>`).join('')}</table></div><p>스포츠맨십 긍정 행동 +10점 / 부정 행동 -10점</p>`)}
function matchCard(m){m=resolved(m);let sc=m.home_score!=null&&m.away_score!=null?` (${m.home_score}:${m.away_score})`:'';return `<div class="match"><span>${label(m.home)} ${m.winner===m.home?'🏅':''}</span><span class="vs">${m.winner?'종료':'VS'}${sc}</span><span>${label(m.away)} ${m.winner===m.away?'🏅':''}</span></div>`}
function bracket(){let s=sport;return card('🏆 대진과 기록',`<div class="row"><select id="sport" onchange="sport=this.value;render()">${opts(SPORTS,s)}</select></div>${s==='이어달리기'?relayView():D.league[s]?`<div class="two">${[1,2].map(g=>`<div class="group"><h3>${g===1?'A':'B'}조 · ${D.league[s][g-1].split('').join(' / ')}반</h3>${rows(s).filter(m=>m.stage==='group'&&m.group_name==='AB'[g-1]).map(matchCard).join('')}<p class="small muted">${groupRank(s,g).arr.map(x=>`${x.n}반 ${x.w}승`).join(' · ')}</p>${groupRank(s,g).tied?'<div class="notice">동률 발생: 순위 확정 규정 확인 필요</div>':''}</div>`).join('')}</div>`:''}${s==='이어달리기'?'':D.records.includes(s)?`<table><tr><th>학급</th><th>기록</th></tr>${state.records.filter(r=>r.sport===s).map(r=>`<tr><td>${r.class_no}반</td><td>${r.result??'미입력'}</td></tr>`).join('')}</table>`:`<h3>${D.knock[s]?'8강':'준결승'}</h3>${rows(s).filter(m=>m.stage===(D.knock[s]?'quarter':'semi')).map(matchCard).join('')}${D.knock[s]?'<h3>준결승</h3>'+rows(s).filter(m=>m.stage==='semi').map(matchCard).join(''):''}<h3>결승</h3>${rows(s).filter(m=>m.stage==='final').map(matchCard).join('')}`}`)}
function scoreboard(){return card('📊 실시간 종합점수',`<table><tr><th>순위(임시)</th><th>학급</th><th>획득점수</th></tr>${ranks().map((r,i)=>`<tr><td>${i+1}</td><td>3-${r.n}반</td><td><b>${r.total}</b>점</td></tr>`).join('')}</table><p class="muted small">경기별 결승 진출 결과 또는 기록경기 8개 반 기록이 확정되면 점수 반영. 동점 시 순위 규정 확인 필요.</p>`)}
function schedule(){let ms=state.matches.filter(m=>{const x=resolved(m);return x.home===klass||x.away===klass});return card('📅 반별 경기일정',`<select onchange="klass=+this.value;render()">${opts(Array.from({length:8},(_,i)=>i+1),klass)}</select><table><tr><th>종목</th><th>단계</th><th>상대</th><th>일시 / 장소</th></tr>${ms.map(m=>{let x=resolved(m),sc=state.schedule.find(a=>a.match_id===m.id);return `<tr><td>${m.sport}</td><td>${m.stage==='group'?m.group_name+'조':m.stage==='quarter'?'8강':m.stage==='semi'?'준결승':'결승'}</td><td>${label(x.home===klass?x.away:x.home)}</td><td>${sc?.starts_at?periodDate(sc.starts_at):'미정'} ${esc(sc?.venue||'')}</td></tr>`}).join('')}</table><p>이어달리기: ${D.league['이어달리기'].some(g=>g.includes(String(klass)))?'예선 참가 · 조별 1·2위 결승 진출':'예선 대기'}</p><p>기록경기: ${D.records.join(' · ')}</p>`)}
async function save(kind,args,local){try{if(online){const {error}=await db.rpc(kind,args);if(error)throw error;await refresh()}else{local();persist();render()}alert('저장했어.')}catch(e){alert('저장 실패: '+e.message);await refresh()}}
function admin(){if(online&&!isAdmin)return card('🔐 교사별 개별 로그인',`<div class="row"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button class="primary" onclick="login()">로그인</button></div><p class="muted">계정은 Supabase Authentication에서 생성하고 admins 테이블에 등록해야 해.</p>`);return card('🔐 관리자 모드',`<div class="row">${online?`<button class="light" onclick="logout()">로그아웃</button>`:'<span class="notice">체험 모드: 이 브라우저에만 저장되며 다른 사람과 공유되지 않아.</span>'}<button class="light" onclick="refresh()">최신 데이터 불러오기</button></div><div class="tabs">${[['matches','경기일정·결과'],['records','기록경기'],['penalties','스포츠맨십·감점'],['schedule','경기일정']].map(([k,v])=>`<button class="${mode===k?'selected':''}" onclick="mode='${k}';render()">${v}</button>`).join('')}</div>${mode==='matches'?adminMatches():mode==='records'?adminRecords():mode==='penalties'?adminPenalties():adminSchedule()}`)}
function adminMatches(){return `<div class="row"><select onchange="adminSport=this.value;render()">${opts([...Object.keys(D.league),...Object.keys(D.knock)],adminSport)}</select></div>${adminSport==='이어달리기'?adminRelay():rows(adminSport).map(m=>{let x=resolved(m),sc=state.schedule.find(v=>v.match_id===m.id);return `<div class="group" style="margin:9px 0"><b>${esc(m.id)}</b> · <b>${label(x.home)} VS ${label(x.away)}</b><div class="row" style="margin-top:10px"><label>날짜 <input type="date" id="date-${esc(m.id)}" value="${dayOf(sc?.starts_at)}"></label><label>교시 <select id="period-${esc(m.id)}"><option value="">교시 선택</option>${PERIODS.map(([name])=>`<option value="${name}" ${periodOf(sc?.starts_at)===name?'selected':''}>${name}</option>`).join('')}</select></label><label>장소 <input id="venue-${esc(m.id)}" placeholder="장소" value="${esc(sc?.venue||'')}"></label><button class="primary" onclick="saveSchedule('${esc(m.id)}')">일정 저장</button></div><div class="row" style="margin-top:8px"><select id="w-${esc(m.id)}"><option value="">미확정</option>${[x.home,x.away].filter(Boolean).map(n=>`<option value="${n}" ${m.winner===n?'selected':''}>${n}반 승</option>`).join('')}</select><button class="primary" ${!x.home||!x.away?'disabled':''} onclick="saveGame('${esc(m.id)}')">결과 저장</button></div></div>`}).join('')}<div class="notice">경기별 대진·일정·승리 학급을 한 화면에서 입력할 수 있어. 점수 입력은 필요 없어. 일정과 결과는 각각 저장해 줘. 이어달리기는 별도의 입력 방식이야.</div>`}
function saveGame(id){let m=match(id),w=+$('w-'+id).value||null,x=resolved(m);if(w&&![x.home,x.away].includes(w))return alert('대진을 확인해 줘');save('save_match',{p_id:id,p_version:m.version,p_winner:w,p_home_score:null,p_away_score:null},()=>Object.assign(m,{winner:w,home_score:null,away_score:null,version:m.version+1}))}
function adminRecords(){return `<select onchange="adminSport=this.value;render()">${opts(D.records,D.records.includes(adminSport)?adminSport:D.records[0])}</select>${state.records.filter(r=>r.sport===(D.records.includes(adminSport)?adminSport:D.records[0])).map(r=>`<div class="match"><b>${r.class_no}반</b><input type="number" step="any" id="r-${r.class_no}" value="${r.result??''}" placeholder="기록"><button class="primary" onclick="saveRec('${esc(r.sport)}',${r.class_no})">저장</button></div>`).join('')}<p class="muted">기록의 단위와 높을수록 좋은지/낮을수록 좋은지는 운영 전에 확인해야 해. 현재 무빙릴레이는 낮은 기록 우선, 나머지는 높은 기록 우선으로 임시 설정했어.</p>`}
function saveRec(s,n){let r=state.records.find(x=>x.sport===s&&x.class_no===n),v=$('r-'+n).value;save('save_record',{p_sport:s,p_class:n,p_version:r.version,p_result:v===''?null:+v},()=>{r.result=v===''?null:+v;r.version++})}
function adminPenalties(){return `<div class="row"><label>학급 <select id="pc">${opts([1,2,3,4,5,6,7,8],1)}</select></label><label>종류 <select id="pk"><option value="sportsmanship_negative">스포츠맨십 감점 -10점</option><option value="mileage">마일리지·질서 감점 -10점</option><option value="sportsmanship_positive">스포츠맨십 가점 +10점</option></select></label><input id="pr" placeholder="사유"><button class="primary" onclick="addPenalty()">등록</button></div><h3>입력 이력 (최근 30건)</h3>${[...state.penalties].reverse().slice(0,30).map(p=>`<div class="match"><span>${p.class_no}반 · ${p.kind==='sportsmanship_positive'?'가점':p.kind==='mileage'?'마일리지 감점':'스포츠맨십 감점'} · ${esc(p.reason)}</span><span>${p.voided_at?'취소됨':`<button class="light" onclick="voidPenalty('${p.id}')">입력 취소</button>`}</span></div>`).join('')}`}
function addPenalty(){let n=+$('pc').value,k=$('pk').value,r=$('pr').value;save('add_penalty',{p_class:n,p_kind:k,p_reason:r},()=>state.penalties.push({id:crypto.randomUUID(),class_no:n,kind:k,reason:r,created_at:new Date().toISOString(),voided_at:null}))}
function voidPenalty(id){if(!confirm('이 입력을 취소할까?'))return;save('void_penalty',{p_id:id},()=>{state.penalties.find(p=>p.id===id).voided_at=new Date().toISOString()})}
function adminSchedule(){return `<select onchange="adminSport=this.value;render()">${opts([...Object.keys(D.league),...Object.keys(D.knock)],D.records.includes(adminSport)?'축구':adminSport)}</select>${rows(D.records.includes(adminSport)?'축구':adminSport).map(m=>{let s=state.schedule.find(x=>x.match_id===m.id);return `<div class="group" style="margin:8px 0"><b>${esc(m.id)}</b><div class="row"><input type="date" id="date-${esc(m.id)}" value="${dayOf(s?.starts_at)}"><select id="period-${esc(m.id)}"><option value="">교시 선택</option>${PERIODS.map(([name])=>`<option value="${name}" ${periodOf(s?.starts_at)===name?'selected':''}>${name}</option>`).join('')}</select><input id="venue-${esc(m.id)}" placeholder="장소" value="${esc(s?.venue||'')}"><button class="primary" onclick="saveSchedule('${esc(m.id)}')">저장</button></div></div>`}).join('')}` }
function saveSchedule(id){let dt=$('date-'+id).value,period=$('period-'+id).value,venue=$('venue-'+id).value;if(dt&&!period)return alert('교시를 선택해 줘.');if(!dt&&period)return alert('날짜를 선택해 줘.');const slot=PERIODS.find(x=>x[0]===period),iso=dt&&slot?new Date(dt+'T'+slot[1]+':00').toISOString():null;save('save_schedule',{p_id:id,p_starts_at:iso,p_venue:venue},()=>{state.schedule=state.schedule.filter(s=>s.match_id!==id);state.schedule.push({match_id:id,starts_at:iso,venue})})}
async function login(){const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return alert(error.message);user=data.user;await checkAdmin()}
async function logout(){await db.auth.signOut();user=null;isAdmin=false;render()}
async function checkAdmin(){const {data}=await db.from('admins').select('user_id').eq('user_id',user?.id).maybeSingle();isAdmin=!!data;render()}
function render(){$('connection').textContent=online?'● 실시간 데이터베이스 연결':'● 체험 모드 (이 브라우저에만 저장)';$('nav').innerHTML=TABS.map((t,i)=>`<button class="${tab===i?'on':''}" onclick="tab=${i};render()">${t}</button>`).join('');$('page').innerHTML=[home,rules,points,bracket,scoreboard,schedule,admin][tab]();}
async function init(){if(online){const {data}=await db.auth.getUser();user=data?.user;if(user)await checkAdmin();await refresh();db.channel('league-live').on('postgres_changes',{event:'*',schema:'public'},()=>refresh()).subscribe();}else{loadDemo();render()}}
init();

</script></body></html>
